<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">PuzzleOps RAG offline and online pipeline</title><desc id="desc">Offline knowledge construction and online hybrid retrieval with reranking, citation gate and grounded generation.</desc>
  <defs><style>.bg{fill:#f8faf9}.lane{fill:#fff;stroke:#d8e4e1;stroke-width:2}.node{fill:#eef7f4;stroke:#2d8d78;stroke-width:2}.gate{fill:#fff3e8;stroke:#e77a47;stroke-width:2}.title{font:700 32px Arial,sans-serif;fill:#173139}.laneTitle{font:700 22px Arial,sans-serif;fill:#16866f}.label{font:700 17px Arial,sans-serif;fill:#173139}.small{font:400 14px Arial,sans-serif;fill:#5b7075}.arrow{stroke:#718580;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#718580"/></marker></defs>
  <rect class="bg" width="1440" height="720" rx="8"/><text class="title" x="60" y="62">RAG: offline knowledge engineering + online grounded generation</text>
  <rect class="lane" x="60" y="105" width="1320" height="230" rx="8"/><text class="laneTitle" x="88" y="145">OFFLINE</text>
  <rect class="node" x="180" y="165" width="190" height="105" rx="8"/><text class="label" x="210" y="202">Documents</text><text class="small" x="205" y="230">value rules / audit rules</text><text class="small" x="205" y="252">approved memory / gold</text>
  <rect class="node" x="430" y="165" width="210" height="105" rx="8"/><text class="label" x="463" y="202">Semantic chunks</text><text class="small" x="462" y="230">500-1000 token target</text><text class="small" x="462" y="252">overlap + parent metadata</text>
  <rect class="node" x="700" y="165" width="190" height="105" rx="8"/><text class="label" x="740" y="202">Embedding</text><text class="small" x="735" y="230">DashScope provider</text><text class="small" x="735" y="252">local fallback for tests</text>
  <rect class="node" x="950" y="145" width="210" height="145" rx="8"/><text class="label" x="997" y="184">Dual store</text><text class="small" x="985" y="216">Milvus: vectors</text><text class="small" x="985" y="240">PostgreSQL: raw text</text><text class="small" x="985" y="264">parent + structured fields</text>
  <path class="arrow" d="M370 217H420"/><path class="arrow" d="M640 217H690"/><path class="arrow" d="M890 217H940"/>
  <rect class="lane" x="60" y="375" width="1320" height="285" rx="8"/><text class="laneTitle" x="88" y="415">ONLINE</text>
  <rect class="node" x="145" y="465" width="175" height="100" rx="8"/><text class="label" x="182" y="502">Query build</text><text class="small" x="174" y="530">country + visual facts</text><text class="small" x="174" y="552">light rewrite</text>
  <rect class="node" x="375" y="445" width="180" height="140" rx="8"/><text class="label" x="421" y="482">Hybrid recall</text><text class="small" x="413" y="512">BM25 TopK</text><text class="small" x="413" y="536">vector TopK</text><text class="small" x="413" y="560">parent merge</text>
  <rect class="node" x="610" y="465" width="180" height="100" rx="8"/><text class="label" x="658" y="502">Rerank</text><text class="small" x="650" y="530">qwen3-rerank</text><text class="small" x="650" y="552">local fallback</text>
  <rect class="gate" x="845" y="445" width="190" height="140" rx="8"/><text class="label" x="885" y="482">Relevance gate</text><text class="small" x="880" y="512">hard-negative filter</text><text class="small" x="880" y="536">Top3 citations</text><text class="small" x="880" y="560">insufficient -> review</text>
  <rect class="node" x="1090" y="445" width="210" height="140" rx="8"/><text class="label" x="1135" y="482">Grounded answer</text><text class="small" x="1123" y="512">image + question + evidence</text><text class="small" x="1123" y="536">citation ids required</text><text class="small" x="1123" y="560">trace latency/provider</text>
  <path class="arrow" d="M320 515H365"/><path class="arrow" d="M555 515H600"/><path class="arrow" d="M790 515H835"/><path class="arrow" d="M1035 515H1080"/>
</svg>
