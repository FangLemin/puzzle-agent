<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650" role="img" aria-labelledby="title desc">
  <title id="title">PuzzleOps evaluation snapshot</title><desc id="desc">Aggregate evaluation metrics with explicit semantics and known limitations.</desc>
  <defs><style>.bg{fill:#f8faf9}.card{fill:#fff;stroke:#d8e4e1;stroke-width:2}.good{fill:#e6f5ef;stroke:#16866f;stroke-width:2}.warn{fill:#fff3e8;stroke:#e77a47;stroke-width:2}.title{font:700 32px Arial,sans-serif;fill:#173139}.metric{font:700 34px Arial,sans-serif;fill:#16866f}.metricWarn{font:700 34px Arial,sans-serif;fill:#d36133}.label{font:700 17px Arial,sans-serif;fill:#173139}.small{font:400 14px Arial,sans-serif;fill:#5b7075}</style></defs>
  <rect class="bg" width="1440" height="650" rx="8"/><text class="title" x="60" y="62">Evaluation snapshot: engineering correctness is separated from model quality</text>
  <rect class="good" x="60" y="115" width="250" height="150" rx="8"/><text class="metric" x="92" y="170">45</text><text class="label" x="92" y="202">real samples</text><text class="small" x="92" y="230">Japan 25 · France 20</text>
  <rect class="good" x="335" y="115" width="250" height="150" rx="8"/><text class="metric" x="367" y="170">100%</text><text class="label" x="367" y="202">three-part compliance</text><text class="small" x="367" y="230">subject / mood / composition</text>
  <rect class="good" x="610" y="115" width="250" height="150" rx="8"/><text class="metric" x="642" y="170">100%</text><text class="label" x="642" y="202">field completeness</text><text class="small" x="642" y="230">Feishu payload contract</text>
  <rect class="good" x="885" y="115" width="250" height="150" rx="8"/><text class="metric" x="917" y="170">97%</text><text class="label" x="917" y="202">RAG MRR@5</text><text class="small" x="917" y="230">Recall@5 100% · NDCG@5 98%</text>
  <rect class="warn" x="1160" y="115" width="220" height="150" rx="8"/><text class="metricWarn" x="1192" y="170">20%</text><text class="label" x="1192" y="202">Precision@5</text><text class="small" x="1192" y="230">hard negatives remain</text>
  <rect class="warn" x="145" y="330" width="330" height="165" rx="8"/><text class="metricWarn" x="182" y="389">60%</text><text class="label" x="182" y="423">SA high-potential binary accuracy</text><text class="small" x="182" y="452">small-sample decision-support signal</text><text class="small" x="182" y="476">not production-grade prediction</text>
  <rect class="warn" x="555" y="330" width="330" height="165" rx="8"/><text class="metricWarn" x="592" y="389">18%</text><text class="label" x="592" y="423">Metric-derived grade baseline</text><text class="small" x="592" y="452">rejected as the primary grade path</text><text class="small" x="592" y="476">because metric intervals were unstable</text>
  <rect class="warn" x="965" y="330" width="330" height="165" rx="8"/><text class="metricWarn" x="1002" y="389">66.67%</text><text class="label" x="1002" y="423">Visual similarity gold Hit@5</text><text class="small" x="1002" y="452">MRR 27.78% · confidence gated</text><text class="small" x="1002" y="476">low scores are hidden from reasoning</text>
  <text class="small" x="60" y="570">Public reports expose aggregate metrics only. Raw business rows and real images remain private.</text>
</svg>
