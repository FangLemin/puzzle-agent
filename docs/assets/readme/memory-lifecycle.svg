<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650" role="img" aria-labelledby="title desc">
  <title id="title">Layered Memory lifecycle</title><desc id="desc">Perception, working, long-term and structured fact memories governed by review, conflict and RAG eligibility.</desc>
  <defs><style>.bg{fill:#f8faf9}.node{fill:#fff;stroke:#d8e4e1;stroke-width:2}.active{fill:#e6f5ef;stroke:#16866f;stroke-width:3}.review{fill:#fff3e8;stroke:#e77a47;stroke-width:2}.title{font:700 32px Arial,sans-serif;fill:#173139}.label{font:700 19px Arial,sans-serif;fill:#173139}.small{font:400 14px Arial,sans-serif;fill:#5b7075}.arrow{stroke:#718580;stroke-width:3;fill:none;marker-end:url(#a)}.dash{stroke-dasharray:8 7}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#718580"/></marker></defs>
  <rect class="bg" width="1440" height="650" rx="8"/><text class="title" x="62" y="64">Layered Memory: stateful knowledge with governance</text>
  <rect class="node" x="70" y="155" width="230" height="125" rx="8"/><text class="label" x="108" y="196">1. Perception</text><text class="small" x="108" y="226">VLM observations</text><text class="small" x="108" y="250">temporary visual evidence</text>
  <rect class="node" x="365" y="155" width="230" height="125" rx="8"/><text class="label" x="406" y="196">2. Working</text><text class="small" x="406" y="226">task state and trace</text><text class="small" x="406" y="250">short-lived context</text>
  <rect class="review" x="660" y="135" width="250" height="165" rx="8"/><text class="label" x="708" y="176">HITL governance</text><text class="small" x="700" y="208">approve / reject / retire</text><text class="small" x="700" y="232">conflict + expiry check</text><text class="small" x="700" y="256">fingerprint + source audit</text><text class="small" x="700" y="280">country scope</text>
  <rect class="active" x="975" y="105" width="250" height="125" rx="8"/><text class="label" x="1018" y="146">3. Long-term</text><text class="small" x="1018" y="176">stable approved patterns</text><text class="small" x="1018" y="200">operator-owned knowledge</text>
  <rect class="active" x="975" y="270" width="250" height="125" rx="8"/><text class="label" x="1018" y="311">4. Facts</text><text class="small" x="1018" y="341">country / subject / grade</text><text class="small" x="1018" y="365">metrics + structured labels</text>
  <path class="arrow" d="M300 217H355"/><path class="arrow" d="M595 217H650"/><path class="arrow" d="M910 188H965"/><path class="arrow" d="M910 250H940V332H965"/>
  <rect class="node" x="360" y="445" width="720" height="115" rx="8"/><text class="label" x="405" y="485">RAG eligibility gate</text><text class="small" x="405" y="518">approved + active + approved_for_rag + not expired + no conflict lock</text><text class="small" x="405" y="542">hits write back rag_hit_count and last_rag_hit_at for observability</text>
  <path class="arrow dash" d="M1100 395V430H800V435"/><path class="arrow dash" d="M1100 230V415H640V435"/>
</svg>
