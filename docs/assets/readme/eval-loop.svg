<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
  <title id="title">Agent Harness evaluation loop</title><desc id="desc">Dataset, versioned run, case trace, scoring, failure analysis and HITL correction form a measurable iteration loop.</desc>
  <defs><style>.bg{fill:#f8faf9}.node{fill:#fff;stroke:#d8e4e1;stroke-width:2}.focus{fill:#e6f5ef;stroke:#16866f;stroke-width:3}.warn{fill:#fff3e8;stroke:#e77a47;stroke-width:2}.title{font:700 32px Arial,sans-serif;fill:#173139}.label{font:700 18px Arial,sans-serif;fill:#173139}.small{font:400 14px Arial,sans-serif;fill:#5b7075}.arrow{stroke:#718580;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#718580"/></marker></defs>
  <rect class="bg" width="1440" height="620" rx="8"/><text class="title" x="60" y="62">Agent Harness: turn model behavior into an engineering feedback loop</text>
  <rect class="node" x="75" y="220" width="185" height="120" rx="8"/><text class="label" x="112" y="260">Eval dataset</text><text class="small" x="108" y="290">45 real samples</text><text class="small" x="108" y="314">synthetic demo isolated</text>
  <rect class="focus" x="315" y="200" width="205" height="160" rx="8"/><text class="label" x="352" y="242">Versioned run</text><text class="small" x="350" y="273">prompt + provider</text><text class="small" x="350" y="297">task type + config</text><text class="small" x="350" y="321">run_id + timestamp</text>
  <rect class="node" x="575" y="200" width="205" height="160" rx="8"/><text class="label" x="624" y="242">Case trace</text><text class="small" x="614" y="273">agent output</text><text class="small" x="614" y="297">tool calls + citations</text><text class="small" x="614" y="321">latency + failures</text>
  <rect class="node" x="835" y="200" width="205" height="160" rx="8"/><text class="label" x="896" y="242">Scores</text><text class="small" x="875" y="273">VLM / RAG / risk</text><text class="small" x="875" y="297">grade / field integrity</text><text class="small" x="875" y="321">tool success</text>
  <rect class="warn" x="1095" y="200" width="240" height="160" rx="8"/><text class="label" x="1140" y="242">Failure taxonomy</text><text class="small" x="1135" y="273">retrieval vs prompt</text><text class="small" x="1135" y="297">calibration vs provider</text><text class="small" x="1135" y="321">actionable regression set</text>
  <path class="arrow" d="M260 280H305"/><path class="arrow" d="M520 280H565"/><path class="arrow" d="M780 280H825"/><path class="arrow" d="M1040 280H1085"/>
  <rect class="focus" x="510" y="450" width="420" height="95" rx="8"/><text class="label" x="550" y="490">HITL correction -> gold / memory / next prompt</text><text class="small" x="550" y="520">Human feedback stays auditable and does not silently overwrite model output.</text>
  <path class="arrow" d="M1215 360V497H940"/><path class="arrow" d="M510 497H168V350"/>
</svg>
